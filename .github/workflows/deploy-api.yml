# Builds the API image and deploys it to the droplet.
# Runs when the API (or what it bundles) changes on the main branch, or by hand.
name: Deploy API

on:
  push:
    branches: [main, master]
    paths:
      - apps/api/**
      - packages/contracts/**
      - packages/config/**
      - pnpm-lock.yaml
      - deploy/droplet/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1. Check ──
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck test --filter=@estene/api --filter=@estene/contracts

      # ── 2. Build the image and push it to GitHub Container Registry ──
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/estene-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 3. Copy the compose files to the droplet and start the new image ──
      - name: Deploy to droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key $USER@$HOST"
          scp -i ~/.ssh/deploy_key deploy/droplet/docker-compose.yml deploy/droplet/Caddyfile \
            deploy/droplet/deploy.sh "$USER@$HOST:/opt/estene/"
          $SSH "chmod +x /opt/estene/deploy.sh && /opt/estene/deploy.sh $IMAGE ${{ github.sha }}"
